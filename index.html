<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>執筆集</title>
    <style>
        /* 読みやすく、綺麗なデザインに変更 */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #fcfcfc;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            color: #222;
            text-align: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        /* リンク（ボタンの代わり）のデザイン */
        .story-links {
            list-style: none;
            padding: 0;
        }

        .story-links li {
            margin-bottom: 15px;
        }

        .story-links a {
            display: block;
            padding: 20px;
            background-color: #ffffff;
            border-left: 6px solid #4a90e2; /* 左側に青いアクセント線 */
            text-decoration: none;
            color: #333;
            font-size: 20px;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); /* ふんわりした影 */
        }

        /* マウスを乗せた時の動き */
        .story-links a:hover {
            background-color: #4a90e2;
            color: #ffffff;
            transform: translateX(5px); /* 少し右に動く */
        }

        /* 日付部分のデザイン */
        .story-date {
            display: block;
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
            font-weight: normal;
        }
        
        .story-links a:hover .story-date {
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <h1>執筆集</h1>
    
    <div id="story-list">
        <!-- ここに自動でリンクが追加されます -->
        <p>読み込み中...</p>
    </div>

    <script>
        // ==========================================
        // 📚 storiesフォルダから自動読み込みする仕組み
        // ==========================================
        let githubUser = "";
        let githubRepo = "";

        // URLからGitHubのユーザー名とリポジトリ名を自動判定します
        if (window.location.hostname.includes("github.io")) {
            githubUser = window.location.hostname.split(".")[0];
            let pathSegment = window.location.pathname.split("/")[1];
            
            // https://yu-hs.github.io/ のような場合
            if (!pathSegment || pathSegment === "index.html" || pathSegment === "") {
                githubRepo = window.location.hostname;
            } else {
                // https://yu-hs.github.io/collection-main/ のような場合
                githubRepo = pathSegment;
            }
        }

        async function loadStories() {
            const listDiv = document.getElementById("story-list");
            
            // ローカルPC環境（file://）などの場合
            if (!githubUser || !githubRepo) {
                listDiv.innerHTML = `
                    <p>※自動追加機能は、GitHubにアップロードした後に動作します。</p>
                    <p style="font-size: 14px; color: #666;">（現在はご自身のPCで開いているため、自動読み込みはされません。本番環境にアップロードするだけで自動で表示されるようになります）</p>
                `;
                return;
            }

            try {
                // GitHub APIを使って stories フォルダの中身を取得
                const response = await fetch(`https://api.github.com/repos/${githubUser}/${githubRepo}/contents/stories`);
                
                if (!response.ok) {
                    listDiv.innerHTML = "<p>作品が見つかりません。「stories」フォルダを作成し、テキストファイルをアップロードしてください。</p>";
                    return;
                }

                let files = await response.json();
                
                // .txt または .md のみ、名前の降順（新しい順）に並び替え
                files = files.filter(file => file.name.endsWith('.txt') || file.name.endsWith('.md'))
                             .sort((a, b) => b.name.localeCompare(a.name));

                if (files.length === 0) {
                    listDiv.innerHTML = "<p>まだ作品はありません。</p>";
                    return;
                }

                let html = '<ul class="story-links">';
                files.forEach(file => {
                    // 拡張子を取り除く（例: "2026-05-01_タイトル.txt" -> "2026-05-01_タイトル"）
                    let baseName = file.name.replace(/\.[^/.]+$/, "");
                    let dateStr = "";
                    let titleStr = baseName;
                    
                    // アンダースコアで区切られている場合（日付_タイトル）
                    if (baseName.includes("_")) {
                        const parts = baseName.split("_");
                        dateStr = parts[0];
                        titleStr = parts.slice(1).join("_");
                    }

                    // file.path には "stories/2026-05-01_タイトル.txt" のようなパスが入っています
                    html += `<li>
                                <a href="viewer.html?file=${encodeURIComponent(file.path)}">
                                    ${dateStr ? `<span class="story-date">${dateStr}</span>` : ""}
                                    ${titleStr}
                                </a>
                             </li>`;
                });
                html += '</ul>';
                
                listDiv.innerHTML = html;

            } catch (error) {
                listDiv.innerHTML = "<p>作品の読み込みに失敗しました。</p>";
            }
        }

        // ページが読み込まれた時に実行
        document.addEventListener('DOMContentLoaded', loadStories);
    </script>
</body>
</html>
