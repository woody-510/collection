<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>読書中</title>
</head>
<body>
    <button onclick="location.href='index.html'">← 目次に戻る</button>
    <hr>
    
    <pre id="content" style="white-space: pre-wrap; word-wrap: break-word; font-family: sans-serif;">
読み込み中...
    </pre>

    <script>
        // URLから ?file=xxx.txt の部分を取得する関数
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');

        if (fileName) {
            // 指定されたテキストファイルを読みに行く（Fetch API）
            fetch(fileName)
                .then(response => {
                    if (!response.ok) throw new Error('記事が見つかりません');
                    return response.text();
                })
                .then(text => {
                    // 読み込んだ文章を画面に表示
                    document.getElementById('content').innerHTML = text;
                })
                .catch(error => {
                    document.getElementById('content').textContent = "エラーが発生しました: " + error.message;
                });
        } else {
            document.getElementById('content').textContent = "読み込むファイルが指定されていません。";
        }
    </script>
</body>

</html>
