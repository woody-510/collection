<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>読書中</title>
</head>
<body>
    <button onclick="goBack()">← 目次に戻る</button>
    <hr>
    
    <pre id="content" style="white-space: pre-wrap; word-wrap: break-word; font-family: sans-serif;">
読み込み中...
    </pre>

    <script>
        // 【追加】キャッシュを無視して戻るための関数
        function goBack() {
            // URLの後ろに現在時刻をつけることで、ブラウザに「新しいページ」だと思わせる
            // 例: index.html?time=123456789
            location.href = 'index.html?time=' + new Date().getTime();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');

        if (fileName) {
            fetch(fileName)
                .then(response => {
                    // キャッシュされた古いテキストファイルを読まないようヘッダーを指定（念のため）
                    if (!response.ok) throw new Error('記事が見つかりません');
                    return response.text();
                })
                .then(text => {
                    // セキュリティ対策（XSS防止）
                    document.getElementById('content').textContent = text;
                })
                .catch(error => {
                    document.getElementById('content').textContent = "エラーが発生しました: " + error.message;
                });
        } else {
            document.getElementById('content').textContent = "読み込むファイルが指定されていません。";
        }
    </script>
</body>
</html>
